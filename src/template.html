<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light on Paper — Hanga Studio · Mount Fuji at dawn</title>
<meta name="description" content="Mount Fuji at dawn from Kawaguchi-ko, drawn entirely in vectors: one self-contained postcard that tilts under a lamp, turns over, and plays its own soundtrack.">
<meta name="theme-color" content="#efe7d6">
<meta property="og:type" content="website">
<meta property="og:title" content="Light on Paper — Mount Fuji at dawn">
<meta property="og:description" content="A single postcard, drawn in vectors. Tilt it, turn it, listen to it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b2547'/%3E%3Cpath d='M6 25 L14 9 h4 L26 25 Z' fill='%235b6488'/%3E%3Cpath d='M12.6 12 L14 9 h4 l1.6 3 q-1.6 1.6 -3.6 1.6 T12.6 12 Z' fill='%23fff'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23ffd9a0'/%3E%3C/svg%3E">
<style>
@CSS@
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="bg-wall"></span>
  <span class="bg-seigaiha"></span>
  <span class="bg-pool"></span>
  <span class="bg-grain"></span>
  <span class="bg-vig"></span>
</div>

<div class="topbar">
  <span class="brand"><span class="mk" aria-hidden="true" lang="ja">浮</span><span>Hanga&nbsp;Studio</span></span>
  <span class="meta">Exhibition&nbsp;I · Room&nbsp;2</span>
</div>

<header class="masthead">
  <h1>Light on Paper</h1>
  <p class="sub"><span class="jp" lang="ja">富士山</span> &nbsp;·&nbsp; a single postcard, drawn in vectors</p>
  <span class="rule" aria-hidden="true"></span>
</header>

<div class="stage">
  <div class="card" id="card" role="img"
       aria-label="Illustrated postcard of Mount Fuji at dawn with a torii gate, cherry blossoms and a lake; flip to see the addressed back.">

    <!-- ============================ FRONT ============================ -->
    <div class="face front">
@SVG_FRONT@

      <div class="foil" aria-hidden="true">
        <span class="foil-holo"></span>
        <span class="foil-sparkle"></span>
        <span class="foil-sparkle2"></span>
        <span class="foil-sheen"></span>
        <span class="foil-glint"></span>
        <span class="foil-spot"></span>
      </div>
    </div>

    <!-- ============================ BACK ============================ -->
    <div class="face back">
@SVG_BACK@
    </div>
  </div>
</div>

<div class="plinth">
  <figure class="label">
    <figcaption>
      <p class="lt">Mount Fuji at dawn, from Kawaguchi-ko</p>
      <p class="la">Hanga Studio · 2026</p>
      <p class="lm">Holographic laminate over ink on washi</p>
      <p class="ld"><span>900 × 600</span><span>Ed. 01</span></p>
    </figcaption>
  </figure>

  <div class="console" role="group" aria-label="Postcard controls">
    <button id="flip">Turn the card<kbd aria-hidden="true">F</kbd></button>
    <button id="dl">Save the plate<kbd aria-hidden="true">S</kbd></button>
    <button id="enhanceBtn" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span id="enhanceLabel">Enhance off</span></button>

    <div class="sound" id="sound">
      <button id="play" aria-pressed="false" title="Play / pause the soundtrack (press M)">
        <span class="glyph" id="playGlyph">▶</span>
        <span id="playLabel">Play</span>
        <kbd aria-hidden="true">M</kbd>
      </button>
      <span class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <input id="vol" type="range" min="0" max="100" value="55" aria-label="Soundtrack volume">
    </div>
  </div>
</div>

<footer class="footer">
  <span class="jp" lang="ja">河口湖にて</span>
  <span class="pip" aria-hidden="true"></span>
  <span>Hanga Studio</span>
  <span class="pip" aria-hidden="true"></span>
  <span>MMXXVI</span>
</footer>

<script>
@JS_CARD@
</script>

<script>
@JS_SOUNDTRACK@
</script>
</body>
</html>
