  <!--
  The farthest thing in the picture: sky, sun, its rays, high clouds.
  -->
        </defs>

        <g clip-path="url(#clipCard)">

          <!-- sky -->
          <rect x="0" y="0" width="900" height="410" fill="url(#sky)"/>

          <!-- Sun and rays. The lines never end: the mask lets them thin out
               with distance, the way light does. The angles are deliberately
               uneven. Sixteen spokes at exactly 22.5 degrees is a starburst
               drawn by a program; crepuscular rays come in bundles with dark
               gaps between them, so some of these are 7 degrees apart and the
               widest gap is 36. -->
          <!-- Sun and rays. The lines never end: the mask lets them thin out
               with distance, the way light does. The angles are deliberately
               uneven. Sixteen spokes at exactly 22.5 degrees is a starburst
               drawn by a program; crepuscular rays come in bundles with dark
               gaps between them, so some of these are 7 degrees apart and the
               widest gap is 36.

               Each ray is drawn three times - wide and faint, medium, narrow
               and brightest - because a single stroke has a hard edge and a
               constant width, and up close that reads as a ruler-drawn stripe
               rather than as light. Three steps across the width give it a
               falloff. Deliberately not a blur filter: a blurred group over
               this much of the card is the cost the calm rendering cannot pay. -->
          <g class="rays" mask="url(#rayMask)" opacity=".26" fill="none"
             stroke="#ffe8c6" stroke-linecap="round">
