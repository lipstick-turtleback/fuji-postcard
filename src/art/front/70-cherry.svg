  <!--
  The branch at the top left and the petals coming off it.
  -->

          <!-- cherry branch, top-left.

               The branch moves in the gust tier and not in the still air, and
               so do its flowers. A branch overhanging a lake is held up by wind
               somewhere under it, and when the wind comes up the reeds on the
               shore bend, the birds go across the sky and the petals come off
               this branch in seconds instead of half a minute — but the branch
               itself, the thing the petals are coming off, used to be the one
               part of the scene bolted to the sky. The cause of the motion is
               the same cause as the shower's.

               It rocks about its root, not its middle: the branch enters the
               card at (-10, 26) and is held there, and the far end of a 254-unit
               branch at 0.4° travels 1.8 units while the root travels nothing.

               And no two flowers move together. A branch is not a rigid bar —
               it flexes, so the swing runs out along it and everything further
               from the root arrives later and wider. Each flower therefore
               carries its own period, its own phase and its own amplitude, the
               amplitude growing with its distance from the root (0.32 units at
               the first blossom, 0.7 at the tip) and the period running 10.2 s
               near the root to 36.2 s at the end.

               The fifteen periods were not free, and the rhythm probe said so
               the first time this ran. A flower that swings two thirds of a unit
               is not a traveller, so it is compared against everything within
               200 css px, and the branch hangs over most of the lake: the fish
               rings at 97, 127 and 179, the petals drifting on the water at 73,
               101, 109 and 139, the birds at 31.9, 43.7 and 39, the clouds at
               46, 62 and 38, the mist at 78 and 103. The first set put 19.4
               under the fish's 97 — five times, exactly — and 17.9 under 179,
               ten times. Every one of the fifteen was then walked against that
               whole list and against the other fourteen: none equals another,
               none is within a percent of a whole multiple of another. -->
          <g class="branch" style="--rock: .4deg; --rock-dur: 13.3s; --rock-delay: -5s">
            <!-- The branch is a filled shape, not a stroke. A stroke has one
                 width from end to end, and a branch that never thins reads as
                 a piece of tubing laid across the sky. This one is ten units
                 where it enters the card and four at its tip, and it carries a
                 darker underside so it has a near side and a far side. -->
            <path d="M-10 21 C60 35 118 69 168 113 C196 138 218 154 244 162
                     L244 166 C218 160 196 148 168 123 C118 79 60 45 -10 31 Z"
                  fill="#3a2a2c"/>
            <path d="M-10 29 C60 43 118 77 168 121 C196 146 218 159 243 166"
                  fill="none" stroke="#2b1e20" stroke-width="2.2" stroke-opacity=".75"
                  stroke-linecap="round"/>
            <path d="M-8 22 C58 36 114 68 162 110" fill="none" stroke="#4a3739"
                  stroke-width="1.6" stroke-opacity=".5" stroke-linecap="round"/>
            <path d="M62 42 C86 26 108 20 132 22" fill="none" stroke="#3a2a2c" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M120 78 C142 66 158 62 178 66" fill="none" stroke="#3a2a2c" stroke-width="4" stroke-linecap="round"/>
            <path d="M172 122 C192 116 206 112 224 116" fill="none" stroke="#3a2a2c" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M100 62 C96 44 92 34 84 24" fill="none" stroke="#3a2a2c" stroke-width="3.4" stroke-linecap="round"/>
            <!-- no two flowers the same size, angle or kind: a spray with
                 some flowers turned away and some still shut is a spray,
                 a row of identical discs is a pattern. Each one is also its
                 own motion now: the four numbers beside each are how far it
                 swings, how far it tips, how long a swing takes and where in
                 the swing it starts, and they grow with distance from the
                 root. (They are written as custom properties, which is why
                 they cannot be named here: two hyphens are illegal inside a
                 comment, and this file has to parse as XML once it is in the
                 page.) -->
            <g>
              <g class="bloom" style="--sway: .32px; --tilt: 1.2deg; --sway-dur: 10.2s; --sway-delay: -3s"><use href="#blossom" transform="translate(28 34) rotate(6) scale(1.15)"/></g>
              <g class="bloom" style="--sway: .4px; --tilt: 1.4deg; --sway-dur: 12.6s; --sway-delay: -6s"><use href="#blossom" transform="translate(74 22) rotate(-14) scale(1)"/></g>
              <g class="bloom" style="--sway: .5px; --tilt: 1.75deg; --sway-dur: 18.2s; --sway-delay: -17s"><use href="#blossom" transform="translate(132 22) rotate(21) scale(1.08)"/></g>
              <g class="bloom" style="--sway: .47px; --tilt: 1.65deg; --sway-dur: 16.9s; --sway-delay: -2s"><use href="#blossom" transform="translate(104 66) rotate(-7) scale(.92)"/></g>
              <g class="bloom" style="--sway: .55px; --tilt: 1.9deg; --sway-dur: 21.7s; --sway-delay: -12s"><use href="#blossom" transform="translate(158 62) rotate(33) scale(1.02)"/></g>
              <g class="bloom" style="--sway: .59px; --tilt: 2deg; --sway-dur: 24.5s; --sway-delay: -8s"><use href="#blossom" transform="translate(168 118) rotate(-19) scale(1.1)"/></g>
              <g class="bloom" style="--sway: .66px; --tilt: 2.2deg; --sway-dur: 30.8s; --sway-delay: -19s"><use href="#blossom" transform="translate(206 148) rotate(11) scale(.95)"/></g>
            </g>
            <g>
              <g class="bloom" style="--sway: .6px; --tilt: 2.05deg; --sway-dur: 26.2s; --sway-delay: -15s"><use href="#blossomSide" transform="translate(186 74) rotate(-12) scale(1.05)"/></g>
              <g class="bloom" style="--sway: .67px; --tilt: 2.25deg; --sway-dur: 33.3s; --sway-delay: -7s"><use href="#blossomSide" transform="translate(222 116) rotate(14) scale(.95)"/></g>
              <g class="bloom" style="--sway: .7px; --tilt: 2.3deg; --sway-dur: 36.2s; --sway-delay: -10s"><use href="#blossomSide" transform="translate(244 164) rotate(-4) scale(.85)"/></g>
              <g class="bloom" style="--sway: .42px; --tilt: 1.5deg; --sway-dur: 14.2s; --sway-delay: -14s"><use href="#blossomSide" transform="translate(84 24) rotate(24) scale(.8)"/></g>
            </g>
            <!-- the spurs are drawn with the branch, so the buds sit at the
                 ends of them rather than floating next to it -->
            <g fill="none" stroke="#3a2a2c" stroke-width="2.2" stroke-linecap="round">
              <path d="M50 36 C54 44 55 48 55 52"/>
              <path d="M140 30 C144 36 146 39 147 43"/>
              <path d="M192 100 C196 104 198 106 199 109"/>
              <path d="M112 60 C108 52 106 48 105 45"/>
            </g>
            <g>
              <g class="bloom" style="--sway: .38px; --tilt: 1.35deg; --sway-dur: 11.6s; --sway-delay: -11s"><use href="#bud" transform="translate(55 54) rotate(16) scale(1.05)"/></g>
              <g class="bloom" style="--sway: .53px; --tilt: 1.85deg; --sway-dur: 20.1s; --sway-delay: -5s"><use href="#bud" transform="translate(147 45) rotate(-9) scale(.95)"/></g>
              <g class="bloom" style="--sway: .63px; --tilt: 2.15deg; --sway-dur: 28.6s; --sway-delay: -4s"><use href="#bud" transform="translate(199 111) rotate(23) scale(.85)"/></g>
              <g class="bloom" style="--sway: .46px; --tilt: 1.6deg; --sway-dur: 15.7s; --sway-delay: -9s"><use href="#bud" transform="translate(105 43) rotate(-21) scale(.8)"/></g>
            </g>
          </g>

          <!-- falling petals: ten of them, all ten falling. The periods and
               the trajectories are in src/art/gen/Petals.data.mjs. -->
          @GEN:Petals@
