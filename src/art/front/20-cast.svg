  <!--
  The cast: marks drawn once and placed by hand — grass tufts, reeds,
  a heron, a duck, a blossom, a bud. Closes the defs block opened by
  10-paint.svg and opens the card: everything after this is painted
  inside clipCard, until 90-age.svg closes it.
  -->

          <!-- bank furniture, drawn once and placed by hand.
               every blade is its own stroke width, so a tuft tapers as it
               rises instead of reading as a bundle of matchsticks -->
          <g id="tuft" fill="none" stroke-linecap="round">
            <path d="M0 0 C-1 -6 -4 -12 -9 -17"   stroke-width="1.5"/>
            <path d="M0 0 C0 -7 0 -14 -2 -22"     stroke-width="1.6"/>
            <path d="M1 -1 C2 -9 4 -16 7 -21"     stroke-width="1.3"/>
            <path d="M1 -1 C3 -6 6 -11 11 -14"    stroke-width="1.2"/>
            <path d="M-1 -1 C-3 -5 -6 -8 -12 -10" stroke-width="1.1"/>
            <path d="M0 0 C2 -4 4 -7 6 -8"        stroke-width="1"/>
          </g>
          <!-- a reed: one stem, two leaves that keep the stem's direction,
               and the dark head that gives the cluster its rhythm -->
          <g id="reed" stroke-linecap="round">
            <path d="M0 0 C1 -14 0 -28 2 -44" fill="none" stroke-width="1.8"/>
            <path d="M0.5 -10 C4 -20 6 -30 6.5 -40" fill="none" stroke-width="1.2"/>
            <path d="M0 -16 C-3 -24 -5 -31 -5.5 -38" fill="none" stroke-width="1.1"/>
            <ellipse cx="2.2" cy="-49" rx="1.9" ry="6.2" stroke="none"/>
            <path d="M2.2 -54 L2.4 -58" fill="none" stroke-width=".9"/>
          </g>
          <!-- A second tuft: four blades, tighter and more upright, one bent
               over. And a third: eight blades, low and splayed. The first
               tuft was used thirty-one times, so every clump on the shore was
               the same six-blade fan at a different scale - size varying on
               its own while shape stayed fixed, which is the defect the rules
               call out. Three shapes, cycled, so no two neighbours match. -->
          <g id="tuftB" fill="none" stroke-linecap="round">
            <path d="M0 0 C-1 -5 -2 -11 -5 -15" stroke-width="1.4"/>
            <path d="M0 0 C1 -6 1 -13 0 -19" stroke-width="1.6"/>
            <path d="M1 -1 C3 -7 5 -12 6 -14" stroke-width="1.2"/>
            <path d="M-1 -1 C-4 -4 -8 -6 -11 -6" stroke-width="1"/>
          </g>
          <g id="tuftC" fill="none" stroke-linecap="round">
            <path d="M0 0 C-2 -4 -6 -7 -12 -8" stroke-width="1.1"/>
            <path d="M0 0 C-2 -5 -4 -9 -8 -12" stroke-width="1.2"/>
            <path d="M0 0 C-1 -5 -1 -9 -3 -12" stroke-width="1.3"/>
            <path d="M0 0 C0 -6 1 -10 1 -13" stroke-width="1.4"/>
            <path d="M1 -1 C2 -6 4 -9 6 -11" stroke-width="1.2"/>
            <path d="M1 -1 C3 -5 6 -8 9 -9" stroke-width="1.1"/>
            <path d="M-1 -1 C-3 -3 -6 -4 -9 -4" stroke-width=".9"/>
            <path d="M0 0 C2 -3 4 -5 5 -5" stroke-width=".9"/>
          </g>
          <!-- a reed that leans, with its head lower and one leaf crossing
               the stem, against the upright one -->
          <g id="reedB" stroke-linecap="round">
            <path d="M0 0 C-2 -12 -4 -24 -8 -36" fill="none" stroke-width="1.6"/>
            <path d="M-1 -8 C2 -16 3 -24 3 -30" fill="none" stroke-width="1.1"/>
            <path d="M-3 -18 C-7 -24 -10 -28 -12 -32" fill="none" stroke-width="1"/>
            <ellipse cx="-8.6" cy="-41" rx="1.7" ry="5.4" stroke="none" transform="rotate(-12 -8.6 -41)"/>
            <path d="M-8.6 -45.5 L-9.4 -49" fill="none" stroke-width=".9"/>
          </g>
          <!-- the heron: long legs, a thin S neck, a bill like a needle -->
          <g id="heron">
            <path d="M-10 -16 C-13 -21 -9 -27 -2 -28 C5 -29 11 -26 12 -21
                     C13 -16 7 -12 0 -12 C-5 -12 -9 -13 -10 -16 Z"/>
            <path d="M-10 -19 L-18 -15.5 L-9 -13 Z"/>
            <path d="M7 -25 C11 -30 11 -36 8.5 -40 C7 -42.5 7.5 -44.5 9.5 -45.5"
                  fill="none" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M8.5 -46.5 C11.5 -47.5 14.5 -46.5 15.5 -45.5 L25 -43.5
                     L15.5 -42.5 C12.5 -42 9.5 -43 8.5 -44.5 Z"/>
            <path d="M-1 -13 L-2.5 -6 L-2 0" fill="none" stroke-width="1.1" stroke-linecap="round"/>
            <path d="M4.5 -13 L5.5 -6 L6.5 0" fill="none" stroke-width="1.1" stroke-linecap="round"/>
          </g>
          <!-- a duck floats: no legs, and the tail is cocked a little,
               which is what makes the blob read as a bird at all -->
          <g id="duck">
            <path d="M-8 -5 C-12 -8 -10 -11 -4 -11.5 C1 -12 7 -10 8 -7 C9 -4 5 -2 0 -2 C-4 -2 -7 -3 -8 -5 Z"/>
            <circle cx="7" cy="-11" r="2.6"/>
            <path d="M9 -12 L14 -11 L9 -10 Z"/>
          </g>

          <!-- a cherry blossom, seen face on. the petals are filled with a
               gradient whose centre sits up and to the right, because that
               is where the sun is; the flower is not a flat pink disc -->
          <g id="blossom">
            <!-- Five petals at exactly 72 degrees, all the same size, is a
                 rosette drawn by a program. Cherry blossoms do have five
                 petals, so the count stays; what breaks the draw is that the
                 spacing is 3, 74, 141, 219, 286 and no two petals share a
                 radius or a distance from the centre. It also means the
                 rotation on each placement now does something: a five-fold
                 symmetric shape rotated by 6 degrees looks identical to one
                 rotated by 78. -->
            <g fill="url(#bloomLight)">
              <ellipse cx="0.3" cy="-6.4" rx="4.1" ry="5.4" transform="rotate(3 0 0)"/>
              <ellipse cx="5.9" cy="-1.7" rx="3.9" ry="5.1" transform="rotate(74 0 0)"/>
              <ellipse cx="4.2" cy="5.1" rx="4.3" ry="5.6" transform="rotate(141 0 0)"/>
              <ellipse cx="-3.9" cy="4.8" rx="4.0" ry="5.2" transform="rotate(219 0 0)"/>
              <ellipse cx="-6.2" cy="-1.6" rx="4.2" ry="5.0" transform="rotate(286 0 0)"/>
            </g>
            <circle r="2.1" fill="#c9607a"/>
            <g stroke="#f7e3a8" stroke-width=".7" stroke-linecap="round" fill="none">
              <path d="M0 0 L-1.4 -3.4 M0 0 L1.5 -3.2 M0 0 L2.6 -1.2 M0 0 L-2.6 -1.4"/>
            </g>
            <g fill="#f7e3a8">
              <circle cx="-1.4" cy="-3.4" r=".7"/>
              <circle cx="1.5" cy="-3.2" r=".7"/>
              <circle cx="2.6" cy="-1.2" r=".7"/>
              <circle cx="-2.6" cy="-1.4" r=".7"/>
            </g>
          </g>

          <!-- the same flower seen from the side: three petals, a dark
               calyx, and it is immediately obvious that the branch has
               flowers in it and not stickers on it -->
          <g id="blossomSide">
            <path d="M0 0 C-5 -1 -7 -5 -4.6 -7.6 C-2 -10 2 -9.4 3.4 -6.8 Z" fill="url(#bloomLight)"/>
            <path d="M0 0 C-1.6 -5 1 -8.6 4.4 -8.2 C7.4 -7.8 8 -3.6 5.4 -1 Z" fill="url(#bloomLight)" opacity=".92"/>
            <path d="M0 0 C4.4 1.2 7.6 -1.4 7 -4.6 C6.4 -7.6 2.6 -8.4 0.4 -6.2 Z" fill="url(#bloomLight)" opacity=".8"/>
            <path d="M-0.6 1.4 C-2.6 0.6 -3.4 -1 -3 -2.6 L1.4 -2 C2 -0.2 1.2 1.2 -0.6 1.4 Z" fill="#8c4a52"/>
          </g>

          <!-- a bud: closed, deeper than an open flower, on a short spur -->
          <g id="bud">
            <path d="M0 0 C-2.6 -1.2 -3.2 -4.4 -1.4 -6.6 C0.6 -8.8 3.4 -8 4 -5.4 C4.4 -3 2.4 -0.8 0 0 Z"
                  fill="#e79fb2"/>
            <path d="M0.2 0.4 C-1.8 -0.4 -2.8 -2 -2.6 -3.8 L1.2 -3 C1.8 -1.2 1.4 0.2 0.2 0.4 Z" fill="#8c4a52"/>
          </g>
