  <!--
  The gilded rules, outside the clip: the frame is the plate, and the
  lettering is measured against it by scripts/test-plate.mjs.

  The gilt is a gradient at .55, and a gradient at .55 has no contrast on a
  pale ground: where the left rule crosses a blossom it stops being there, and
  the frame reads as four separate rules that meet at corners rather than one
  line the picture passes behind. A printed rule is ink with gilt over it, not
  gilt alone, so the same two rects go down first as a dark line. Over the
  night sky the ink hides under the gilt and nothing changes; over the petals
  the ink is what the eye follows, and the rule stays continuous the whole way
  round. The ink is drawn a little wider than the gilt on purpose: a printed
  rule has an edge, and the two dark shoulders are what carry that edge across
  a bright ground, where a narrower line under the gold would still be swamped.
  -->
        <g fill="none" stroke="#151b2c">
          <rect x="14" y="14" class="print-rule" width="872" height="572" rx="4"
                stroke-width="3.2" stroke-opacity=".5"/>
          <rect x="21" y="21" class="print-rule" width="858" height="558" rx="3"
                stroke-width="1.6" stroke-opacity=".35"/>
        </g>
        <g fill="none" stroke="url(#goldFrame)">
          <rect x="14" y="14" class="print-rule" width="872" height="572" rx="4"
                stroke-width="1.6" stroke-opacity=".55"/>
          <rect x="21" y="21" class="print-rule" width="858" height="558" rx="3"
                stroke-width=".7" stroke-opacity=".3"/>
        </g>
        <g id="edgeGlint" fill="none" stroke="url(#goldShine)" stroke-width="2"
           stroke-linecap="round">
          <path class="rail" d="M16 14 H884" stroke-dasharray="170 698" stroke-dashoffset="0"/>
          <path class="rail" d="M16 586 H884" stroke-dasharray="170 698" stroke-dashoffset="0"/>
          <path class="rail-v" d="M14 16 V584" stroke-dasharray="170 398" stroke-dashoffset="0"/>
          <path class="rail-v" d="M886 16 V584" stroke-dasharray="170 398" stroke-dashoffset="0"/>
        </g>
