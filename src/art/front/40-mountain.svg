  <!--
  The mountain, and the ridges in front of it, each lighter than the
  last because of air between the eye and the rock.
  -->

          <!-- distant ridges, each one lighter than the last: air in the way -->
          <path d="M0 404 L0 336 C56 328 116 352 172 378 C214 396 246 402 276 404 Z" fill="#7484a8" opacity=".8"/>
          <path d="M900 404 L900 322 C838 328 782 352 730 380 C700 396 676 402 654 404 Z" fill="#6b7ba1" opacity=".76"/>
          <path d="M0 404 L0 366 C74 360 150 380 214 396 C246 403 268 404 290 404 Z" fill="#5d6c92" opacity=".62"/>
          <path d="M900 404 L900 358 C846 358 792 376 744 392 C718 400 698 403 678 404 Z" fill="#54628a" opacity=".56"/>

          <!-- Mount Fuji -->
          <use href="#fujiPath" fill="url(#fujiBody)"/>
          <g clip-path="url(#clipFuji)">
            <!-- the shadow side: one graded sweep, no seam where it ends -->
            <rect x="120" y="120" width="420" height="300" fill="url(#terminator)"/>
            <!-- the lit side, warmed by the low sun -->
            <path d="M452 158 L466 152 L478 162 C486 170 494 182 502 200 C548 296 636 386 754 404 L452 404 Z"
                  fill="url(#litSide)"/>
            <!-- the sun grazes the right shoulder: a rim of warm light -->
            <path d="M440 152 L478 162 C486 170 494 182 502 200 C548 296 636 386 754 404"
                  fill="none" stroke="url(#rimLight)" stroke-width="4.4"
                  stroke-linecap="round" filter="url(#rim)"/>

            <!-- Fuji's fall lines. The gullies are the mountain's whole
                 character: they radiate from the summit craters to the
                 foot, and with the sun at the upper right each one is
                 shadowed on its left flank and lit on its right.
                 Drawn under the snow so the snowline cuts them off. -->
            <g clip-path="url(#clipFuji)" filter="url(#gully)">
              <g fill="#222846">
                <path d="M376 247 L420 247 L268 398 L256 398 Z" opacity=".13"/>
                <path d="M393 252 L431 252 L342 376 L330 376 Z" opacity=".10"/>
                <path d="M414 244 L464 244 L411 402 L397 402 Z" opacity=".12"/>
                <path d="M441 247 L475 247 L477 356 L463 356 Z" opacity=".08"/>
                <path d="M455 256 L501 256 L540 400 L528 400 Z" opacity=".11"/>
                <path d="M481 246 L519 246 L610 372 L598 372 Z" opacity=".09"/>
                <path d="M499 251 L541 251 L679 394 L665 394 Z" opacity=".12"/>
              </g>
              <g fill="#b3bdd0">
                <path d="M420 247 L438 247 L276 398 L268 398 Z" opacity=".09"/>
                <path d="M431 252 L446 252 L349 376 L342 376 Z" opacity=".07"/>
                <path d="M464 244 L481 244 L418 402 L411 402 Z" opacity=".10"/>
                <path d="M475 247 L494 247 L486 356 L477 356 Z" opacity=".06"/>
                <path d="M501 256 L522 256 L549 400 L540 400 Z" opacity=".09"/>
                <path d="M519 246 L542 246 L620 372 L610 372 Z" opacity=".07"/>
                <path d="M541 251 L561 251 L688 394 L679 394 Z" opacity=".10"/>
              </g>
            </g>

            <!-- The dark fall lines belong under the snow. They are gullies in
                 the rock, and where the snow has filled them they do not stay
                 dark - drawn on top of the cap they were two grey scratches
                 running up the white face and stopping dead at the crater. The
                 pale ones above stay, because a snow-filled gully does catch
                 the light. -->
            <g fill="none" stroke="#161c30" stroke-opacity=".16" stroke-width="1.6">
              <path d="M446 166 C432 246 410 320 372 396"/>
              <path d="M470 168 C486 248 508 322 540 394"/>
            </g>
            <!-- snow cap. the edge is a snowline, not a saw: it hangs into
                 the gullies and climbs back over every ridge it crosses -->
            <use href="#snowCapPath" fill="url(#snow)"/>
            <use href="#snowCapPath" fill="url(#snowShade)"/>
            <!-- the melt edge casts a hairline onto the rock below it -->
            <path d="M564 208 C562 218 558 230 554 234 C548 238 542 220 536 216
                     C528 212 524 240 518 246 C510 252 500 228 492 224
                     C484 220 478 248 470 254 C462 260 458 236 452 232
                     C444 228 440 256 428 260 C418 263 416 242 410 238
                     C402 233 396 252 384 250 C372 248 372 234 360 230
                     C350 227 344 224 336 220"
                  fill="none" stroke="#7f8fab" stroke-opacity=".45" stroke-width="2.4"
                  filter="url(#edgeWear)"/>
            <!-- snow left standing in the two gullies that face the sun.
                 the fall lines themselves are already drawn under the cap;
                 this is only the bright residue at their head -->
            <g fill="#eef3fa" opacity=".22" filter="url(#gully)">
              <path d="M466 250 C470 268 473 284 476 302 C481 284 485 268 489 252 Z"/>
              <path d="M520 246 C523 260 525 272 527 286 C531 272 535 258 539 248 Z"/>
            </g>
            <!-- Summit crater: a shallow bowl, lit on the far rim. It used to
                 be six points joined by straight lines, and at the apex of the
                 whole composition a straight line and a sharp corner read as a
                 cut gem rather than as the top of a volcano. Every edge here is
                 a curve, the bowl is wider than it is tall because we see it
                 nearly side-on, and the far rim takes the light while the near
                 rim keeps a shadow. -->
            <path d="M437 156 C443 149 456 146 468 149 C478 152 483 158 479 165
                     C474 173 458 177 445 173 C435 170 431 162 437 156 Z"
                  fill="#93a6c2" opacity=".42"/>
            <path d="M437 156 C444 149 457 146 469 150" fill="none" stroke="#fdfbf6"
                  stroke-opacity=".5" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M446 173 C456 176 469 174 477 168" fill="none" stroke="#5f6d8c"
                  stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/>
            <!-- fall lines down the cone -->
            <g fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1.3">
              <path d="M452 162 C472 234 494 304 528 386"/>
              <path d="M440 160 C420 244 388 324 348 398"/>
              <path d="M478 166 C506 242 540 318 588 392"/>
              <path d="M462 164 C470 250 480 330 494 400"/>
              <path d="M428 168 C404 250 372 326 322 396"/>
            </g>
          </g>
