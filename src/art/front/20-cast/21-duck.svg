          <!-- a duck floats: no legs, the body is cut by the water along a flat
               bottom, and the tail is cocked above the back line. The old mark
               was an egg with a ball on the end and a wedge for a bill — a
               silhouette with no breast, no stern and no waterline, which is
               why it read as a rubber toy rather than a bird sitting in the
               lake. The bottom edge is deliberately the flattest part of the
               outline: a floating thing is hidden by the surface it floats on,
               so the breast takes the full curve and the belly takes none. The
               head is drawn into the neck rather than being a separate circle,
               because two overlapping round shapes leave a pinch where a bird
               has a smooth line from bill to back. -->
          <g id="duck">
            <path
              d="M-12.2 -8.9
                 C-10.4 -10 -7.6 -10.1 -4.6 -10.1
                 C-1.2 -10.1 2.4 -10 4.6 -11.1
                 C5.6 -12.6 8.4 -13.1 10.2 -12
                 L14.6 -11.1 L10.4 -10
                 C9.4 -9 8.2 -7.9 7 -6.8
                 C6.2 -5.6 5.9 -4.2 5.6 -3.1
                 C2 -2.5 -4.6 -2.7 -8.2 -3.7
                 C-10.2 -4.3 -11.6 -6.4 -12.2 -8.9 Z"
            />
          </g>
