name: build and check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # build, staleness of the committed page, page validator, Biome, Prettier
      - run: npm test
