<title id="ttlFront">Mount Fuji at dawn, from Kawaguchi-ko</title>
<desc id="dscFront">A print in the woodblock manner. Fuji stands in blue shadow with a scalloped
snowline; a low sun to the right throws pale rays across a sky that runs from deep blue to
orange. Bands of mist lie across the middle of the mountain and it is mirrored, broken into
horizontal bands, in the still lake below. A cherry branch with blossoms enters from the top
left. A red torii stands in the water at left, its reflection a short red smear; two ducks
swim near it. A boatman in a conical hat poles across the lake at right and a heron stands at
the near shore. Reeds grow in dense stands and stones lie along the dark bank in the
foreground. A vertical paper strip at left carries the title 富士山 and the place 河口湖 above
a red seal. A stamp cancelled TOKYO sits at the top right. Lettering along the bottom edge
reads 富嶽, MT. FUJI, 3,776 M, KAWAGUCHI-KO · JAPAN.</desc>

CORRESPONDENCE CARD · 郵便はがき. At left, a handwritten message: "Wish you were here. The
mountain showed itself for only a moment at dawn — then the cloud came back, and everyone
applauded anyway. See you in autumn." Below it, blank address rules, a small line drawing of
Fuji, and KAWAGUCHI-KO · 35.4387° N, 138.7265° E. At right, the address block: TO, Hana Sato,
4-12-3 Kitazawa, Setagaya-ku, Tokyo 155-0031, Japan, and a postal code box reading 〒155-0031.
In the top right corner a 84-yen NIPPON stamp carrying the same mountain is cancelled with a
circular mark: KAWAGUCHIKO, 24.5.12. Par avion stripes run along the bottom edge.</desc>
